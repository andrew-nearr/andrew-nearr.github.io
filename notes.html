        <p class="note-date"><time datetime="2026-07-31">July 31, 2026</time></p>
        <div class="note-copy">
          <p>Roy今天被“放鸽子”了。</p>
          <p>约她上午10:00去做拍摄的客户，时间到了却联系不上。Roy在微信中和我说：“我打算等到10:15，还没有回信息我就回来……”</p>
          <p>透过手机屏幕，我都能感觉到，这个省略号里载满了她对客户的失望。或许，她能接受对方无法赶过来，甚至能接受客户退单；但客户采用这种联系不上的方式，让Roy有些委屈。</p>
          <p>Roy把这段委屈，用省略号的方式向我表达。我感知到了。</p>
          <p>我鼓励她去喝一杯咖啡。</p>
        </div>
      </article>
